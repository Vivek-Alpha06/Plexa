name: Deploy Contracts

# Manual-only (Continuous Deployment). This never runs on push, so it cannot
# break the CI gate. Trigger it from the Actions tab when you want to deploy the
# oracle + swap router + factory to a Stellar network.
#
# Requires a repository secret:
#   STELLAR_SECRET_KEY  — the S... seed of a funded deployer identity.
on:
  workflow_dispatch:
    inputs:
      network:
        description: Stellar network
        type: choice
        default: testnet
        options: [testnet, mainnet]
      usdc_contract:
        description: USDC token contract id (blank = the network's Circle USDC SAC)
        type: string
        default: ""
      router_contract:
        description: Soroswap router id (blank = the network default; mainnet never uses the mock)
        type: string
        default: ""
      oracle_max_age:
        description: Max age in seconds before a Reflector price is refused
        type: string
        default: "1800"

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to ${{ inputs.network }}
    runs-on: ubuntu-latest
    # Gate real deployments behind a GitHub Environment so approvals/secrets are
    # scoped. Create an Environment of this name in repo Settings if desired.
    environment: ${{ inputs.network }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Pinned, not `stable`: the install hash of a contract is the sha256 of
      # its bytecode, and rustc codegen shifts between releases. A floating
      # toolchain means the hash a member reproduces from source need not match
      # the wasm their funds run on. Bump deliberately and re-record the hash.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          # The network rejects the wasm32-unknown-unknown output
          # (reference-types), so deploy artifacts are built for wasm32v1-none.
          targets: wasm32v1-none

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: contracts

      - name: Install stellar-cli
        run: cargo install --locked stellar-cli

      - name: Import deployer identity
        env:
          STELLAR_SECRET_KEY: ${{ secrets.STELLAR_SECRET_KEY }}
        run: |
          if [ -z "${STELLAR_SECRET_KEY:-}" ]; then
            echo "::error::STELLAR_SECRET_KEY secret is not set."
            exit 1
          fi
          stellar keys add ci --secret-key <<< "$STELLAR_SECRET_KEY"
          echo "Deployer: $(stellar keys address ci)"

      - name: Build deploy Wasm (wasm32v1-none)
        working-directory: contracts
        run: cargo build --workspace --target wasm32v1-none --release --locked

      # Recorded in the run log so the deployed bytecode is auditable after the
      # fact: these are the install hashes the deploy will produce.
      - name: Record wasm hashes
        working-directory: contracts
        run: sha256sum target/wasm32v1-none/release/*.wasm | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Configure network RPC
        env:
          RPC_URL: ${{ secrets.STELLAR_RPC_URL }}
        run: |
          if [ "${{ inputs.network }}" = "mainnet" ]; then
            if [ -z "${RPC_URL:-}" ]; then
              echo "::error::Set the STELLAR_RPC_URL secret to a mainnet Soroban RPC endpoint."
              exit 1
            fi
            stellar network add mainnet --rpc-url "$RPC_URL" \
              --network-passphrase "Public Global Stellar Network ; September 2015"
          fi

      - name: Deploy
        env:
          STELLAR_ACCOUNT: ci
          NETWORK: ${{ inputs.network }}
          USDC_CONTRACT: ${{ inputs.usdc_contract }}
          ROUTER_CONTRACT: ${{ inputs.router_contract }}
          ORACLE_MAX_AGE: ${{ inputs.oracle_max_age }}
        run: ./scripts/deploy.sh
