name: Keeper

# Advances every Active group so members never sign to settle or resolve.
# `settle` and `resolve_period` are permissionless on the contract, so this
# funded account can drive them on everyone's behalf.
#
# GitHub's scheduled runners are best-effort and can lag under load. The keeper
# is idempotent and catches up multiple missed periods in one run, so a late
# tick costs latency, not correctness. For tighter timing, run keeper.mjs on a
# small always-on host instead.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Simulate only — do not submit transactions"
        type: boolean
        default: false

concurrency:
  # Never let two keepers race for the same sequence number.
  group: plexa-keeper
  cancel-in-progress: false

jobs:
  advance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: keeper/package-lock.json

      - name: Install
        working-directory: keeper
        run: npm ci --no-audit --no-fund

      - name: Advance groups
        working-directory: keeper
        env:
          KEEPER_SECRET: ${{ secrets.KEEPER_SECRET }}
          FACTORY_ID: ${{ vars.FACTORY_ID }}
          RPC_URL: ${{ vars.RPC_URL || 'https://soroban-testnet.stellar.org' }}
          NETWORK_PASSPHRASE: ${{ vars.NETWORK_PASSPHRASE || 'Test SDF Network ; September 2015' }}
        run: node keeper.mjs ${{ inputs.dry_run && '--dry-run' || '' }}
